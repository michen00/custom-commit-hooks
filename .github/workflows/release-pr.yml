---
name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (0.1.0 or v0.1.0); leave empty to infer'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="$RELEASE_VERSION_INPUT"

          if [ -z "$raw" ]; then
            # Derive the next semver from conventional commits since the latest tag.
            raw="$(git cliff --bumped-version)"
            echo "Inferred version from conventional commits: $raw"
          fi

          if ! tag="$(scripts/release/parse-version.sh "$raw")"; then
            echo "::error::Invalid version '$raw'. Use X.Y.Z or vX.Y.Z."
            exit 1
          fi

          # With no releasable commits, --bumped-version echoes the current tag.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Nothing to release."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=release/$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # No cache: pip here. It keys off a hashed requirements.txt or
          # pyproject.toml, and this repository ships neither, so it only ever
          # warned "Cache paths are empty" without caching anything. pre-commit
          # hook environments are cached separately where that matters.
          python-version: '3.x'
          check-latest: true

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pre-commit

      # Stamps the pending version as its own section rather than refreshing
      # Unreleased. Refreshing is what the weekly changelog-autoupdate workflow
      # does and is right there, but it is wrong during a release: the moment
      # the tag exists, `git cliff --unreleased` stops reporting the commits it
      # covers, and any entry that only ever lived under Unreleased is dropped
      # by the next run with nowhere to go.
      - name: Stamp the release into the changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: scripts/release/stamp-changelog.sh "$RELEASE_TAG"

      - name: Run prettier on CHANGELOG.md
        run: npx prettier --write CHANGELOG.md

      - name: Validate changelog formatting
        run: pre-commit run --files CHANGELOG.md

      # Consumers copy the README snippet verbatim, so it has to name the version
      # being released. The self-pin in .pre-commit-config.yaml is left alone on
      # purpose: pre-commit checks a rev out to resolve it, and the tag does not
      # exist until this PR merges, so pinning it here would fail these very
      # checks. The weekly pre-commit-autoupdate workflow moves it forward after
      # the tag lands.
      - name: Bump the README rev pin
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: scripts/release/bump-pins.sh "$RELEASE_TAG" README.md

      - name: Validate the bumped README
        run: pre-commit run --files README.md

      - name: Run tests
        run: make test

      - name: Create release PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.version.outputs.branch }}
          base: main
          delete-branch: true
          sign-commits: true
          title: 'chore(release): prepare ${{ steps.version.outputs.tag }}'
          commit-message: 'chore(release): prepare ${{ steps.version.outputs.tag }}'
          add-paths: |
            CHANGELOG.md
            README.md
          body: |
            This PR prepares release `${{ steps.version.outputs.tag }}`.

            ## Included
            - Refreshes `CHANGELOG.md` unreleased section
            - Points the `README.md` install snippet at
              `${{ steps.version.outputs.tag }}`
            - Validates tests before proposing release prep

            The `.pre-commit-config.yaml` self-pin is not touched here — the tag
            does not exist yet, so pinning it would fail this PR's own checks.
            The weekly pre-commit autoupdate moves it forward after the tag lands.

            Merging this PR creates and pushes the signed tag
            `${{ steps.version.outputs.tag }}` and publishes the release.
            No local tagging step is needed.
