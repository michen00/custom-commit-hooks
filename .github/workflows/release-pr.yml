---
name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 0.1.0 or v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version input
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="$RELEASE_VERSION_INPUT"

          case "$raw" in
            v*) tag="$raw" ;;
            *) tag="v$raw" ;;
          esac

          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Invalid version '$raw'. Use X.Y.Z or vX.Y.Z."
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=release/$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          check-latest: true
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pre-commit

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Update unreleased changelog
        run: scripts/update-unreleased.sh

      - name: Run prettier on CHANGELOG.md
        run: npx prettier --write CHANGELOG.md

      - name: Validate changelog formatting
        run: pre-commit run --files CHANGELOG.md

      - name: Run tests
        run: make test

      - name: Create release PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.version.outputs.branch }}
          base: main
          delete-branch: true
          sign-commits: true
          title: 'chore(release): prepare ${{ steps.version.outputs.tag }}'
          commit-message: 'chore(release): prepare ${{ steps.version.outputs.tag }}'
          add-paths: |
            CHANGELOG.md
          body: |
            This PR prepares release `${{ steps.version.outputs.tag }}`.

            ## Included
            - Refreshes `CHANGELOG.md` unreleased section
            - Validates tests before proposing release prep

            After merge, publish by creating/pushing
            tag `${{ steps.version.outputs.tag }}`.
            You can also run the manual release publish workflow.
