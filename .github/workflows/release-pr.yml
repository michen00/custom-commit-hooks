---
name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (0.1.0 or v0.1.0); leave empty to infer'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="$RELEASE_VERSION_INPUT"

          if [ -z "$raw" ]; then
            # Derive the next semver from conventional commits since the latest tag.
            raw="$(git cliff --bumped-version)"
            echo "Inferred version from conventional commits: $raw"
          fi

          # Strict vMAJOR.MINOR.PATCH parse. A glob such as v[0-9]*.[0-9]*.[0-9]*
          # also accepts "v1.0.0; rm -rf /", since * matches separators too.
          invalid() {
            echo "::error::Invalid version '$raw'. Use X.Y.Z or vX.Y.Z."
            exit 1
          }

          rest="${raw#v}"

          major="${rest%%.*}"
          after_major="${rest#*.}"
          [ "$after_major" != "$rest" ] || invalid

          minor="${after_major%%.*}"
          patch="${after_major#*.}"
          [ "$patch" != "$after_major" ] || invalid

          for part in "$major" "$minor" "$patch"; do
            case "$part" in
              '' | *[!0-9]*) invalid ;;
            esac
          done

          tag="v$major.$minor.$patch"

          # With no releasable commits, --bumped-version echoes the current tag.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Nothing to release."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=release/$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          check-latest: true
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pre-commit

      - name: Update unreleased changelog
        run: scripts/update-unreleased.sh

      - name: Run prettier on CHANGELOG.md
        run: npx prettier --write CHANGELOG.md

      - name: Validate changelog formatting
        run: pre-commit run --files CHANGELOG.md

      - name: Run tests
        run: make test

      - name: Create release PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.version.outputs.branch }}
          base: main
          delete-branch: true
          sign-commits: true
          title: 'chore(release): prepare ${{ steps.version.outputs.tag }}'
          commit-message: 'chore(release): prepare ${{ steps.version.outputs.tag }}'
          add-paths: |
            CHANGELOG.md
          body: |
            This PR prepares release `${{ steps.version.outputs.tag }}`.

            ## Included
            - Refreshes `CHANGELOG.md` unreleased section
            - Validates tests before proposing release prep

            Merging this PR creates and pushes the signed tag
            `${{ steps.version.outputs.tag }}` and publishes the release.
            No local tagging step is needed.
