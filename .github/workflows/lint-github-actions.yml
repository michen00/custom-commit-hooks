---
name: lint GitHub Actions workflows
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow files
        uses: docker://rhysd/actionlint:v1.7.12
        with:
          args: -color
