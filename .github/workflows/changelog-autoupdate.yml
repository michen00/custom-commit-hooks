---
name: Changelog autoupdate
on:
  schedule:
    - cron: '0 0 * * 1' # Run every Monday at 00:00
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH_NAME: chore/changelog-autoupdate

jobs:
  # Builds the changelog under a read-only token, so the tools it installs never
  # run beside the write token that opening the pull request needs.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history needed for git cliff
          persist-credentials: false
      # Temporary; see the note in release-pr.yml and tracking issue #87. Pinned
      # only because 2.14.x drops commits that touch .git-blame-ignore-revs
      # alone (orhun/git-cliff#1643). Drop the pin once that ships rather
      # than bumping it.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - name: Update Unreleased section
        run: scripts/update-unreleased.sh
      - name: Format CHANGELOG.md
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yml
          globs: |
            CHANGELOG.md
      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

  pull-request:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: changelog
      - name: Push changes and create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: '${{ env.BRANCH_NAME }}'
          sign-commits: true
          title: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          body: |
            This PR updates the Unreleased section of CHANGELOG.md with recent commits.

            Generated by [git-cliff](https://git-cliff.org/).
          commit-message: 'docs(CHANGELOG.md): autoupdate Unreleased section'
          delete-branch: true
          base: main
