---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # No cache: pip here. It keys off a hashed requirements.txt or
          # pyproject.toml, and this repository ships neither, so it only ever
          # warned "Cache paths are empty" without caching anything. pre-commit
          # hook environments are cached separately where that matters.
          python-version: '3.x'
          check-latest: true
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit-hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/.cache/pre-commit
          key: >
            ${{ runner.os }}-precommit-
            py${{ steps.setup-python.outputs.python-version }}-
            ${{ hashFiles('.pre-commit-config.yaml') }}-
            ${{ env.CACHE_NUMBER }}
      - name: Install pre-commit hooks
        if: steps.cache-pre-commit-hooks.outputs.cache-hit != 'true'
        run: |
          pre-commit install-hooks
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

  python-tests:
    name: Python checks test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest checks/tests

  tests:
    strategy:
      matrix:
        include:
          # Ubuntu: latest Git with coverage (both suites)
          - os: ubuntu-latest
            git-version: latest
            suite: unit
          - os: ubuntu-latest
            git-version: latest
            suite: integration
          # Ubuntu: floor Git version (unit only)
          - os: ubuntu-latest
            git-version: '2.30.0'
            suite: unit
          # OS compatibility: macOS and Windows (unit only, latest Git)
          - os: macos-latest
            git-version: latest
            suite: unit
          - os: windows-latest
            git-version: latest
            suite: unit
    runs-on: ${{ matrix.os }}
    env:
      # bashcov with simplecov-cobertura generates coverage/coverage.xml
      COVERAGE_REPORT: coverage/coverage.xml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # fetch-depth of 2 enables diff coverage
      - name: Install Git ${{ matrix.git-version }}
        if: matrix.git-version != 'latest' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libexpat1-dev gettext libz-dev libssl-dev
          curl -sL "https://github.com/git/git/archive/v${{ matrix.git-version }}.tar.gz" \
            | tar xz
          cd "git-${{ matrix.git-version }}"
          # NO_CURL: the tests never fetch over HTTP, and building without
          # curl keeps the runner's libcurl headers out of an old Git's build.
          # -std=gnu17: GCC 15 defaults to C23, where thread_local is a
          # keyword that old Git sources use as a struct name.
          # install gets the same flags, or it rebuilds with the defaults.
          set -- prefix=/usr/local NO_CURL=1 'CFLAGS=-g -O2 -std=gnu17'
          make "$@" all -j"$(nproc)"
          sudo make "$@" install
      - name: Verify Git
        run: git --version
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        if: matrix.os == 'ubuntu-latest' && matrix.git-version == 'latest'
        with:
          ruby-version: ruby
      - name: 'Run ${{ matrix.suite }} tests'
        id: test
        run: |
          set -euo pipefail
          TEST_SCRIPT="tests/test-${{ matrix.suite }}.sh"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] &&
             [ "${{ matrix.git-version }}" = "latest" ]; then
            gem install bashcov simplecov-cobertura
            set +e
            bashcov "$TEST_SCRIPT"
            echo "test_exit=$?" >> "$GITHUB_OUTPUT"
            if [ -f "$COVERAGE_REPORT" ]; then
              echo "coverage_created=true" >> "$GITHUB_OUTPUT"
            fi
            set -e
          else
            set +e
            bash "$TEST_SCRIPT"
            echo "test_exit=$?" >> "$GITHUB_OUTPUT"
            set -e
          fi
      - name: Upload to Codecov
        if: ${{ steps.test.outputs.coverage_created == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ env.COVERAGE_REPORT }}
          flags: ${{ matrix.suite }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Fail if tests failed
        if: ${{ steps.test.outputs.test_exit != '0' }}
        run: |
          exit_code=${{ steps.test.outputs.test_exit }}
          exit "$exit_code"
