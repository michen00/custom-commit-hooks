---
name: Release Tag

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release-tag:
    # Only same-repo release branches. Fork PRs never reach this job, so the
    # branch name below cannot be chosen by an outside contributor.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          tag="${HEAD_REF#release/}"

          # Strict vMAJOR.MINOR.PATCH parse. A glob such as v[0-9]*.[0-9]*.[0-9]*
          # would also accept "v1.0.0; rm -rf /", so each part is checked for
          # digits explicitly before the value is used anywhere.
          rest="${tag#v}"
          if [ "$rest" = "$tag" ]; then
            echo "::error::Branch '$HEAD_REF' does not encode a vX.Y.Z tag."
            exit 1
          fi

          # Each separator is confirmed present: "${x#*.}" is a no-op when x has
          # no dot, which would otherwise let "v1.2" parse as major/minor/minor.
          major="${rest%%.*}"
          after_major="${rest#*.}"
          if [ "$after_major" = "$rest" ]; then
            echo "::error::Branch '$HEAD_REF' does not encode a vX.Y.Z tag."
            exit 1
          fi

          minor="${after_major%%.*}"
          patch="${after_major#*.}"
          if [ "$patch" = "$after_major" ]; then
            echo "::error::Branch '$HEAD_REF' does not encode a vX.Y.Z tag."
            exit 1
          fi

          for part in "$major" "$minor" "$patch"; do
            case "$part" in
              '' | *[!0-9]*)
                echo "::error::Branch '$HEAD_REF' does not encode a vX.Y.Z tag."
                exit 1
                ;;
            esac
          done

          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Import release GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_tag_gpgsign: true
          trust_level: 5

      - name: Create signed tag
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists; skipping tag creation."
            exit 0
          fi

          git tag -a -s "$RELEASE_TAG" -m "$RELEASE_TAG"
          git verify-tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag pushed with GITHUB_TOKEN does not fire `on: push: tags`, so
          # Release Publish is dispatched explicitly. workflow_dispatch is
          # exempt from the rule that blocks workflows triggering workflows.
          gh workflow run release-publish.yml --ref main -f tag="$RELEASE_TAG"
