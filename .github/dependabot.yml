---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 0 1,15 * *' # 1st and 15th monthly at midnight UTC
    groups:
      actions:
        patterns: ['*']
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key silently drops this whole entry. The delay is long
      # because majors merge with no other soak.
      default-days: 30
