---
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      # default-days only: GitHub rejects the semver-* keys for this ecosystem,
      # and an invalid key silently drops this whole entry.
      default-days: 7
